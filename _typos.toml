[files]
extend-exclude = ["**/build_assets/**", "*.json", "**/*-RU.md"]

[type.locale]
extend-glob = ["**/locale.rs"]
check-file = false

[default.extend-words]
# "unparseable" is the spelling the codebase uses for values a parser rejects.
unparseable = "unparseable"
Unparseable = "Unparseable"
flate = "flate"
strat = "strat"
axe = "axe"
BlockBehaviour = "BlockBehaviour"
behaviour = "behaviour"
# British spellings used across the shared docs/comments (project already allows
# "behaviour"/"neighbour").
colour = "colour"
colours = "colours"
coloured = "coloured"
centre = "centre"
centred = "centred"
neighbouring = "neighbouring"
modelled = "modelled"
interruptable = "interruptable"
neighbour = "neighbour"
neighbours = "neighbours"
honour = "honour"
honoured = "honoured"
honouring = "honouring"
honours = "honours"
armour = "armour"
behaviours = "behaviours"
oxidis = "oxidis"
oxidises = "oxidises"
oxidising = "oxidising"
randomised = "randomised"
recognise = "recognise"
recognised = "recognised"
unrecognised = "unrecognised"
requeueing = "requeueing"
synchronisation = "synchronisation"
travelling = "travelling"
levelling = "levelling"
recolour = "recolour"
desynchronise = "desynchronise"
Modelling = "Modelling"
# Vanilla stronghold piece-type IDs (shs, shsd, shrc, ...).
shs = "shs"
# Vanilla carver tag name (minecraft:overworld_carver_replaceables).
replaceables = "replaceables"
# Mojang's shipped translation key (snbt.parser.undescore_not_allowed).
undescore = "undescore"
# Vanilla block tag name minecraft:convertable_to_mud
convertable = "convertable"
# Vanilla block name: OCHRE_FROGLIGHT.
OCHRE = "OCHRE"

[default.extend-identifiers]
player_mode_customisation = "player_mode_customisation"

[default]
locale = "en-us"

