name: Headless coverage failure diagnostic

on:
  push:
    paths:
      - '.github/workflows/coverage-failure-diagnostic.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: headless-source-coverage
          run-id: 44951434737
          github-token: ${{ github.token }}
          path: /tmp/headless-coverage-diagnostic
      - name: Publish failure details
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          log=$(find /tmp/headless-coverage-diagnostic -name coverage-tests.log -print -quit)
          test -n "$log"
          python3 - "$log" <<'PY'
          import sys
          from pathlib import Path
          lines = Path(sys.argv[1]).read_text(errors='replace').splitlines()
          hits = [i for i, line in enumerate(lines)
                  if 'FAILED' in line or "panicked at" in line or line.startswith('failures:')]
          assert hits, 'Expected at least one failure in the recorded coverage run'
          selected = set()
          for i in hits:
              selected.update(range(max(0, i - 5), min(len(lines), i + 15)))
          Path('/tmp/coverage-failures.log').write_text('\n'.join(lines[i] for i in sorted(selected)) + '\n')
          PY
          python3 .ci/report.py 'Headless coverage failure diagnostic' /tmp/coverage-failures.log
