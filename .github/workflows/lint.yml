name: Lint

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-Dwarnings"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Nightly
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-10-14
          components: rustfmt, clippy

      - name: Cache
        uses: Swatinem/rust-cache@v2

      - name: Spell Check
        uses: crate-ci/typos@v1.48.0

      - name: Format
        if: always()
        run: cargo fmt --all --check 2>&1 | tee /tmp/fmt.log

      - name: Capture suggested formatting patch
        if: always()
        run: |
          rustfmt --edition 2024 --config skip_children=true steel-core/src/world/raid.rs steel-core/src/entity/mob_effect/bad_omen.rs steel-core/src/entity/mob_effect/raid_omen.rs steel-core/src/player/mod.rs steel-core/src/player/player_data.rs steel-core/src/player/player_data_storage/mod.rs steel-core/src/player/player_data_storage/tests.rs
          git diff --binary > /tmp/rustfmt.patch
          base64 -w 6000 /tmp/rustfmt.patch | while IFS= read -r line; do
            echo "::notice title=rustfmt-patch::$line"
          done

      - name: Publish suggested formatting patch
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rustfmt-patch
          path: /tmp/rustfmt.patch

      - name: Clippy
        if: always()
        run: cargo clippy -r --workspace --all-targets --all-features 2>&1 | tee /tmp/clippy.log

      - name: Surface lint failures
        if: failure()
        run: |
          for f in /tmp/fmt.log /tmp/clippy.log; do
            [ -f "$f" ] || continue
            grep -E "^(Diff in|error)" "$f" | head -40 | while IFS= read -r line; do
              echo "::error title=lint::$line"
            done
          done
          exit 1
