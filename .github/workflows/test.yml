name: Test

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-Dwarnings"

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - name: cargo test
        run: cargo test --workspace --verbose 2>&1 | tee /tmp/test.log
      - name: Surface failing tests
        if: failure()
        run: |
          grep -E "^(error|failures:|test .* FAILED|---- )" /tmp/test.log | head -40 | while IFS= read -r line; do
            echo "::error title=test::$line"
          done
          exit 1
