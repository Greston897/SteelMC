name: Test

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-Dwarnings"

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - name: cargo test
        run: |
          set -o pipefail
          cargo test --workspace --verbose 2>&1 | tee /tmp/test.log
      - name: Surface failing tests
        if: failure()
        run: |
          # `CARGO_TERM_COLOR=always` leaves ANSI escapes in the log; strip
          # them before matching or every failure surfaces silently.
          sed 's/\x1b\[[0-9;]*m//g' /tmp/test.log | grep -E "^(error|failures:|test .* FAILED|---- )" | head -40 | while IFS= read -r line; do
            echo "::error title=test::$line"
          done
          exit 1
