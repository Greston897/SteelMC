name: Test

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-Dwarnings"

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - name: cargo test
        run: |
          set -o pipefail
          cargo test --workspace --verbose 2>&1 | tee /tmp/test.log
      - name: Index every observed test by crate and subsystem
        if: always()
        run: python3 .ci/summarize_rust_tests.py /tmp/test.log /tmp/automated-mechanics-tests.json
      - name: Report all kernel subsystems without inferred parity percentages
        if: always()
        run: |
          python3 .ci/subsystem_report.py /tmp/automated-mechanics-tests.json /tmp/SUBSYSTEMS-26.3-ACTIONS.md \
            --sha "$GITHUB_SHA" --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          cat /tmp/SUBSYSTEMS-26.3-ACTIONS.md >> "$GITHUB_STEP_SUMMARY"
      - name: Publish complete per-test outcomes (including ignored and failed)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: automated-mechanics-tests
          path: |
            /tmp/automated-mechanics-tests.json
            /tmp/test.log
            /tmp/SUBSYSTEMS-26.3-ACTIONS.md
          if-no-files-found: error
      - name: Surface failing tests
        if: failure()
        run: |
          # `CARGO_TERM_COLOR=always` leaves ANSI escapes in the log; strip
          # them before matching or every failure surfaces silently.
          sed 's/\x1b\[[0-9;]*m//g' /tmp/test.log > /tmp/test.clean.log
          {
            # Put the actual panic before headings: check annotations may be capped.
            grep -A18 '^error\[E' /tmp/test.clean.log | head -100
            grep -A14 '^---- .* stdout ----' /tmp/test.clean.log | head -60
            grep -E "^(error|failures:|test .* FAILED|---- )" /tmp/test.clean.log | head -40
            # Build-script panics hide behind `failed to run custom build
            # command`; surface the panic location and message as well.
            grep -A8 '^  --- stderr' /tmp/test.clean.log | grep -v '^--$' | head -40
          } | while IFS= read -r line; do
            if [ -n "$line" ]; then echo "::error title=test::$line"; fi
          done
          exit 1
