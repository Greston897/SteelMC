name: Features block diagnostic
on:
  workflow_dispatch:
  push:
    paths:
      - '.ci/vanilla_features/**'
      - '.github/workflows/features-diagnostic.yml'
permissions:
  contents: write
jobs:
  reference:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: vanilla-evidence-optimized-no-lto
      - name: Compile exact Steel test binary once
        env:
          CARGO_BUILD_JOBS: 2
        run: python3 .ci/compile_test_binary.py steel-core /tmp/core-test-binary
      - name: Capture independent vanilla blocks for mismatching clusters
        shell: bash
        run: |
          set -euo pipefail
          mkdir /tmp/feature-reference
          cp .ci/vanilla_features/* /tmp/feature-reference/
          cp steel-core/test_assets/chunk_stage_hashes.json /tmp/feature-reference/fixture.json
          cd /tmp/feature-reference
          python3 prepare.py
          javac --add-exports java.base/jdk.internal.org.objectweb.asm=ALL-UNNAMED ReferenceAgent.java
          printf 'Premain-Class: ReferenceAgent\n\n' > MANIFEST.MF
          jar cfm reference-agent.jar MANIFEST.MF ./*.class
          printf 'eula=true\n' > eula.txt
          printf 'level-seed=13579\nonline-mode=false\nview-distance=2\nsimulation-distance=2\nspawn-protection=0\n' > server.properties
          timeout --kill-after=30s 1800 java -Xmx4G --add-exports java.base/jdk.internal.org.objectweb.asm=ALL-UNNAMED -javaagent:reference-agent.jar=/tmp/feature-reference/reference-agent.jar -jar server.jar nogui 2>&1 | tee /tmp/reference.log
          python3 validate.py 2>&1 | tee -a /tmp/reference.log
          # Only a capture matching ALL existing failing-chunk goldens is trusted.
          cp reference.bin.gz "$GITHUB_WORKSPACE/steel-core/test_assets/chunk_stage_overworld_features_blocks.bin.gz"
      - name: Report block-level mismatches without replacing goldens
        env:
          STEEL_HASH_DEBUG_DIMENSION: minecraft:overworld
          STEEL_HASH_DEBUG_STAGE: minecraft:features
        run: |
          set -o pipefail
          binary=$(cat /tmp/core-test-binary)
          timeout --kill-after=15s 300s "$binary" worldgen::chunk_stage_hashes::chunk_stage_hashes --exact --ignored --nocapture 2>&1 | tee /tmp/features-diagnostic.log
      - name: Publish diagnostics even on failure
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 .ci/report.py "Features diagnostic — vanilla blocks" /tmp/reference.log /tmp/features-diagnostic.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: features-block-reference
          path: |
            /tmp/reference.log
            /tmp/features-diagnostic.log
            /tmp/feature-reference/reference.bin.gz
            /tmp/feature-reference/source.json
