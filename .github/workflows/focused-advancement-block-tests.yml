name: Focused advancement and block regressions

on:
  push:
    paths:
      - '.github/workflows/focused-advancement-block-tests.yml'
      - 'steel-core/src/player/advancement/predicate.rs'
      - 'steel-core/src/behavior/blocks/vegetation/cactus_block.rs'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - name: Run focused tests
        shell: bash
        env:
          RUSTFLAGS: -Dwarnings
        run: |
          set -euo pipefail
          {
            cargo test -p steel-core --lib player::advancement::predicate::tests:: -- --nocapture &&
            cargo test -p steel-core --lib behavior::blocks::vegetation::cactus_block::tests:: -- --nocapture
          } 2>&1 | tee /tmp/focused-regressions.log
          python3 - <<'PY'
          import re
          from pathlib import Path
          text = Path('/tmp/focused-regressions.log').read_text()
          counts = [int(n) for n in re.findall(r'test result: ok\. (\d+) passed;', text)]
          assert len(counts) == 2 and counts[0] >= 10 and counts[1] >= 1, counts
          PY
      - name: Publish results
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 .ci/report.py 'Focused advancement and block regressions' /tmp/focused-regressions.log
