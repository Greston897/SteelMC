name: Focused advancement and block regressions

on:
  push:
    paths:
      - '.github/workflows/focused-advancement-block-tests.yml'
      - 'steel-core/src/player/advancement/predicate.rs'
      - 'steel-core/src/player/advancement/mod.rs'
      - 'steel-core/src/player/lifecycle/world_transition.rs'
      - 'steel-core/src/player/sleep.rs'
      - 'steel-core/src/player/mod.rs'
      - 'steel-core/src/player/player_data.rs'
      - 'steel-core/src/player/player_data_storage/**'
      - 'steel-core/src/player/lifecycle/respawn_restore.rs'
      - 'steel-core/src/player/tests.rs'
      - 'steel-core/src/player/game_mode/item_interaction.rs'
      - 'steel-core/src/player/game_mode/item_interaction/use_on_tests.rs'
      - 'steel-core/src/player/game_mode/block_interaction.rs'
      - 'steel-core/src/behavior/items/honeycomb.rs'
      - 'steel-core/src/behavior/item.rs'
      - 'steel-core/src/behavior/items/shears.rs'
      - 'steel-core/src/behavior/items/block_transformer.rs'
      - 'steel-core/src/behavior/items/block_item.rs'
      - 'steel-core/src/behavior/blocks/vegetation/cactus_block.rs'
      - 'steel-core/src/behavior/blocks/container/beehive_block.rs'
      - 'steel-core/src/block_entity/entities/beehive.rs'
      - 'steel-core/src/behavior/items/item_frame.rs'
      - 'steel-core/src/behavior/items/cushion.rs'
      - 'steel-core/src/entity/entities/objects/decoration/cushion.rs'
      - 'steel-registry/src/blocks/block_state_ext.rs'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - name: Run focused tests
        shell: bash
        env:
          RUSTFLAGS: -Dwarnings
        run: |
          set -euo pipefail
          {
            cargo test -p steel-core --lib player::advancement::predicate::tests:: -- --nocapture &&
            cargo test -p steel-core --lib player::tests::dimension_advancements_only_follow_a_successful_cross_world_transition -- --nocapture &&
            cargo test -p steel-core --lib player::tests::failed_dimension_admission_does_not_grant_advancements -- --nocapture &&
            cargo test -p steel-core --lib player::tests::nether_travel_uses_saved_overworld_entry_and_horizontal_distance -- --nocapture &&
            cargo test -p steel-core --lib player::player_data_storage::tests:: -- --nocapture &&
            cargo test -p steel-core --lib player::lifecycle::respawn_restore::tests::restore_all_copies_vanilla_restore_state_without_mutating_source -- --nocapture &&
            cargo test -p steel-core --lib player::tests::sleep_advancement_requires_successful_sleep_and_permission_to_set_spawn -- --nocapture &&
            cargo test -p steel-core --lib behavior::item::tests:: -- --nocapture &&
            cargo test -p steel-core --lib player::game_mode::item_interaction::use_on_tests:: -- --nocapture &&
            cargo test -p steel-core --lib behavior::blocks::vegetation::cactus_block::tests:: -- --nocapture &&
            cargo test -p steel-core --lib behavior::blocks::container::beehive_block::tests:: -- --nocapture &&
            cargo test -p steel-core --lib block_entity::entities::beehive::tests:: -- --nocapture &&
            cargo test -p steel-registry --lib blocks::block_state_ext::tests::legacy_solidity -- --nocapture &&
            cargo test -p steel-core --lib behavior::items::item_frame::tests:: -- --nocapture &&
            cargo test -p steel-core --lib behavior::items::cushion::tests:: -- --nocapture &&
            cargo test -p steel-core --lib entity::entities::objects::decoration::cushion::tests:: -- --nocapture
          } 2>&1 | tee /tmp/focused-regressions.log
          python3 - <<'PY'
          import re
          from pathlib import Path
          text = Path('/tmp/focused-regressions.log').read_text()
          counts = [int(n) for n in re.findall(r'test result: ok\. (\d+) passed;', text)]
          minimums = [10, 1, 1, 1, 1, 1, 1, 1, 1, 1, 5, 6, 1, 1, 1, 1]
          assert len(counts) == len(minimums) and all(actual >= minimum for actual, minimum in zip(counts, minimums)), counts
          PY
      - name: Publish results
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 .ci/report.py 'Focused advancement and block regressions' /tmp/focused-regressions.log
