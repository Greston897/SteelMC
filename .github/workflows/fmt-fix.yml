name: fmt-fix
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arena/b3a39197-steelmc
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-10-14
          components: rustfmt
      - run: cargo fmt --all
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "no fmt changes"; exit 0; fi
          git commit -m "fmt: cargo fmt --all"
          git push origin HEAD:arena/b3a39197-steelmc
