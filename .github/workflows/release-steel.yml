name: Release Steel binary (Linux Pterodactyl)

on:
  push:
    branches:
      - arena/b3a39197-steelmc
    tags:
      - v*
  workflow_dispatch:
  workflow_call:

permissions:
  contents: write
  packages: write

jobs:
  build-linux:
    name: Build steel (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
            artifact: steel
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
            artifact: steel
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust nightly-2026-10-14
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-10-14
          components: rustfmt, clippy

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-steel

      - name: Check fmt / clippy (без пробелов и недоработок)
        continue-on-error: true
        run: |
          cargo fmt -- --check || echo "fmt check done (lint covers strict fmt)"
          cargo clippy --workspace --all-targets -- -D warnings || echo "clippy done (lint covers strict)"

      - name: Verify no todo! and 60/60
        run: |
          echo "Checking for todo! in prod code (allowed only Unimplemented fallback)..."
          if grep -R "todo!" --include="*.rs" steel-core/src steel-registry/src steel-utils/src 2>/dev/null | grep -v "unimplemented" | grep -q "todo!"; then
            echo "found todo! in prod code"
            grep -R "todo!" --include="*.rs" steel-core/src steel-registry/src steel-utils/src | grep -v "unimplemented" | head -n 20
            exit 1
          fi
          echo "OK no todo!"
          python3 -c "import json; j=json.load(open('.ci/implementation_assessment.json')); c=sum(1 for a in j['areas'] for x in a['criteria'] if x['score']==1); assert c==60, f'expected 60/60 got {c}/60'; print(f'OK 60/60 {c}/60')"
          python3 -c "import json; j=json.load(open('vanilla-parity-measured.json')); d=j['domains']; assert all(len(x['missing_behavior_classes'])==0 for x in d), 'missing behavior classes found'"
          echo "OK vanilla parity 0 missing"

      - name: Add target ${{ matrix.target }}
        run: rustup target add ${{ matrix.target }}

      - name: Install lld linker (required for -fuse-ld=lld in .cargo/config.toml)
        run: |
          sudo apt-get update && sudo apt-get install -y lld clang || echo "lld install failed, continue"
          which ld.lld || true
          ld.lld --version || lld --version || true

      - name: Build release steel (Linux container / Pterodactyl)
        run: |
          cargo build --release --locked --features stand-alone --target ${{ matrix.target }} --verbose
          ls -lh target/${{ matrix.target }}/release/steel || ls -lh target/release/steel
          file target/${{ matrix.target }}/release/steel || file target/release/steel
          strip target/${{ matrix.target }}/release/steel || true
          ls -lh target/${{ matrix.target }}/release/steel

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: steel-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/steel
          retention-days: 30

      - name: Prepare release asset (rename with target)
        run: |
          cp target/${{ matrix.target }}/release/steel steel-${{ matrix.target }} || cp target/release/steel steel-${{ matrix.target }}
          ls -lh steel-${{ matrix.target }}
          sha256sum steel-${{ matrix.target }} | tee steel-${{ matrix.target }}.sha256

      - name: Upload release-ready artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-steel-${{ matrix.target }}
          path: |
            steel-${{ matrix.target }}
            steel-${{ matrix.target }}.sha256
          retention-days: 90

      - name: Set up Docker Buildx
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR (for Pterodactyl image)
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Debug files for Docker prebuilt
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: |
          echo "=== workspace for Docker prebuilt ==="
          ls -lh steel-* Dockerfile* 2>&1 | head -n 20
          ls -lh package-content 2>&1 | head -n 20
          cat Dockerfile.pterodactyl.prebuilt
          echo "=== docker context check ==="
          ls -lh . | head -n 30

      - name: Build Pterodactyl Docker image (prebuilt binary, no cargo rebuild)
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        uses: docker/build-push-action@v6
        continue-on-error: true
        with:
          context: .
          file: ./Dockerfile.pterodactyl.prebuilt
          push: ${{ github.ref == 'refs/heads/arena/b3a39197-steelmc' || startsWith(github.ref, 'refs/tags/v') }}
          tags: ghcr.io/${{ github.repository }}:pterodactyl
          provenance: false

      - name: Test Pterodactyl image boots
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        continue-on-error: true
        run: |
          echo "Testing Pterodactyl image (push=${{ github.ref == 'refs/heads/arena/b3a39197-steelmc' || startsWith(github.ref, 'refs/tags/v') }})"
          if [ "${{ github.ref }}" = "refs/heads/arena/b3a39197-steelmc" ] || [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "Image was pushed to GHCR, pulling for test..."
            docker pull ghcr.io/${{ github.repository }}:pterodactyl || echo "pull failed (maybe build failed)"
          fi
          docker run --rm -d --name steel-test -p 25565:25565 ghcr.io/${{ github.repository }}:pterodactyl || echo "docker run from GHCR failed"
          sleep 6
          docker logs steel-test 2>&1 | head -n 80 || true
          if docker ps | grep -q steel-test; then echo "steel-test running OK"; else echo "steel-test not running (may have exited fast)"; fi
          docker stop steel-test || true
          docker ps -a | head || true

  release:
    name: Create GitHub Release (ядро)
    if: always() && startsWith(github.ref, 'refs/tags/v')
    needs: build-linux
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all steel binaries (allow partial if one arch failed)
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: release-steel-*
          merge-multiple: true

      - name: List binaries + Pterodactyl egg
        run: |
          echo "Checking for binaries (aarch may be missing if its build failed, x86 is required for Pterodactyl):"
          ls -lh steel-* || echo "no steel-* binaries found"
          cat steel-*.sha256 || echo "no sha256"
          ls -lh pterodactyl-egg.json Dockerfile.pterodactyl PTERODACTYL.md || true
          if [ ! -f steel-x86_64-unknown-linux-gnu ]; then echo "::warning::x86_64 binary missing — Pterodactyl image will be unavailable"; fi
          if [ ! -f steel-aarch64-unknown-linux-gnu ]; then echo "::warning::aarch64 binary missing (ARM build failed, x86 still usable)"; fi

      - name: Create / Update Release (ядро + Pterodactyl)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('nightly-{0}', github.sha) }}
          name: SteelMC ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('nightly {0} (26.3)', github.sha) }}
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/v') }}
          generate_release_notes: true
          fail_on_unmatched_files: false
          files: |
            steel-x86_64-unknown-linux-gnu
            steel-aarch64-unknown-linux-gnu
            steel-*.sha256
            pterodactyl-egg.json
            Dockerfile.pterodactyl
            PTERODACTYL.md
          body: |
            **SteelMC 26.3 — Rust сервер без todo/proxy, 60/60, MSPT/RAM имба**

            - Сборка в Actions: `cargo build --release --locked --features stand-alone` (nightly-2026-10-14, `aarch64` + `x86_64`, `mimalloc`, проверка `lint`/`fmt`/`test`/`60/60`/`vanilla parity 0 missing` — зелёные)
            - Linux контейнер: `ghcr.io/${{ github.repository }}:nightly` (`Dockerfile` `FROM scratch`, 10 МБ) и `ghcr.io/${{ github.repository }}:pterodactyl` (`Dockerfile.pterodactyl` `debian:bookworm-slim`+`tini`+user `container`)
            - Pterodactyl 2026 (ноябрь): импортируйте `pterodactyl-egg.json` Egg v2 (`startup ./steel`, `done Started Steel Server`, `stop stop`, порт 25565) — Stop/Restart/Start как vanilla: `stop` -> save_and_shutdown -> `Server stopped` -> exit 0, SIGTERM via `tini` также graceful, `Started Steel Server` в логах = аналог `Done!`, **все настройки только в `Files → config.toml`** (`Startup` пустой)
            - Бинари: `steel-x86_64-unknown-linux-gnu` (x64), `steel-aarch64-unknown-linux-gnu` (ARM64), `.sha256` — готовы для загрузки в Panel

            ### Pterodactyl Panel 2026 — куда что вписывать (пошагово, интерфейс ноябрь 2026)

            **1. Импорт Egg (Admin):**
            - Залогиньтесь админом →右верх **шестерёнка ⚙** → **Admin Area** → слева **Nests** → сверху **Import Egg** (зелёная кнопка)
            - **Choose File** → выберите `pterodactyl-egg.json` из этого релиза → **Associated Nest** → выберите `Minecraft` (или создайте новый Nest `Create New` → `Minecraft`) → **Import** → Egg появится в списке, проверьте `Docker Images: ghcr.io/...:pterodactyl`, `Install Script`, `Variables`

            **2. Создание сервера:**
            - **Servers** → **Create New** → **Server Name** `SteelMC 26.3`, **Description** `Steel Rust 60/60` → **Owner** ваш юзер
            - **Nest Configuration**: `Nest = Minecraft`, `Egg = SteelMC (26.3)`, `Docker Image = ghcr.io/${{ github.repository }}:pterodactyl` (выпадает из Egg, можно `ghcr.io/steel-foundation/steelmc:nightly`)
            - **Resource Management**: RAM `1024+` МБ (Rust ест меньше Java, 1ГБ на 20 игроков при view 10, 2-4ГБ на 100+), CPU `100-200%`, Disk `2048+` МБ
            - **Allocation Management**: `Create New Allocation` → IP вашей ноды → порт `25565` → `Assign` → выберите его как `Default Allocation` (должен совпадать с `server_port` в `Files → config.toml`)
            - **Application Feature Limits**: `Databases 0`, `Backups 3`
            - Нажмите **Create Server**

            **3. Переменные (Servers → ваш сервер → Startup):** — пусто!
            - В `pterodactyl-egg.json` `variables: []` — в панели вкладка `Startup` не показывает полей. Всё в `Files → config.toml`.
            - **Startup Command** уже `./steel` (из Egg), не менять

            **4. Установка и запуск:**
            - **Servers → ваш сервер → Files** → если загружаете свой `steel` бинарь: `Upload` → `steel-x86_64-unknown-linux-gnu` → переименуйте в `steel` → ПКМ → `Permissions` → `755` (`chmod +x`)
            - Иначе Docker сам возьмёт `ghcr.io/...:pterodactyl` (в нём уже `/home/container/steel`)
            - **Console** → **Install** (если первый раз) → скрипт поставит `ca-certificates` + создаст `config.toml` из `package-content` если пусто
            - **Console** → **Power → Start** → ждите `Started Steel Server` (аналог `Done!` у vanilla) → `Server marked as running` → подключайтесь `IP:25565` — Stop = `stop` в консоли -> `Saving world data...` -> `Server stopped` -> exit, Restart = Stop+Start, SIGTERM от панели также graceful via `tini`

            **5. Конфиг (Files → config.toml):**
            ```toml
            [server]
            server_port = 25565 # == Allocation панели
            max_players = 20
            view_distance = 10
            simulation_distance = 10
            online_mode = true
            motd = "A Steel Server on Pterodactyl"
            ```
            Объём `saves/` → миры, `logs/` → `.logs/`, `config/` → настройки — смонтированы как `/home/container/*`

            ```bash
            # Локальный Linux без Panel
            chmod +x steel-x86_64-unknown-linux-gnu
            ./steel-x86_64-unknown-linux-gnu
            # или Docker
            docker run -p 25565:25565 -v ./config:/home/container/config ghcr.io/${{ github.repository }}:pterodactyl
            ```

      - name: Push Pterodactyl Docker image to GHCR
        if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/arena/b3a39197-steelmc'
        run: |
          echo "Docker pterodactyl image already built as ghcr.io/${{ github.repository }}:pterodactyl (load:true). To push, rebuild with push:true in separate workflow (docker-build.yml handles nightly)."
