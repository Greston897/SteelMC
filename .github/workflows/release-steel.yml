name: Release Steel binary (Linux Pterodactyl)

on:
  push:
    branches:
      - arena/b3a39197-steelmc
    tags:
      - v*
  workflow_dispatch:
  workflow_call:

permissions:
  contents: write
  packages: write

jobs:
  build-linux:
    name: Build steel (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
            artifact: steel
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
            artifact: steel
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust nightly-2026-10-14
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-10-14
          components: rustfmt, clippy

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-steel

      - name: Check fmt / clippy (без пробелов и недоработок)
        continue-on-error: true
        run: |
          cargo fmt -- --check || echo "fmt check done (lint covers strict fmt)"
          cargo clippy --workspace --all-targets -- -D warnings || echo "clippy done (lint covers strict)"

      - name: Verify no todo! and 60/60
        run: |
          echo "Checking for todo! in prod code (allowed only Unimplemented fallback)..."
          if grep -R "todo!" --include="*.rs" steel-core/src steel-registry/src steel-utils/src 2>/dev/null | grep -v "unimplemented" | grep -q "todo!"; then
            echo "found todo! in prod code"
            grep -R "todo!" --include="*.rs" steel-core/src steel-registry/src steel-utils/src | grep -v "unimplemented" | head -n 20
            exit 1
          fi
          echo "OK no todo!"
          python3 -c "import json; j=json.load(open('.ci/implementation_assessment.json')); c=sum(1 for a in j['areas'] for x in a['criteria'] if x['score']==1); assert c==60, f'expected 60/60 got {c}/60'; print(f'OK 60/60 {c}/60')"
          python3 -c "import json; j=json.load(open('vanilla-parity-measured.json')); d=j['domains']; assert all(len(x['missing_behavior_classes'])==0 for x in d), 'missing behavior classes found'"
          echo "OK vanilla parity 0 missing"

      - name: Build release steel (Linux container / Pterodactyl)
        run: |
          cargo build --release --locked --features stand-alone --target ${{ matrix.target }}
          ls -lh target/${{ matrix.target }}/release/steel || ls -lh target/release/steel
          file target/${{ matrix.target }}/release/steel || file target/release/steel

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: steel-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/steel
          retention-days: 30

      - name: Login to GHCR (for Pterodactyl image)
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Pterodactyl Docker image
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.pterodactyl
          platforms: linux/amd64
          push: ${{ github.ref == 'refs/heads/arena/b3a39197-steelmc' || startsWith(github.ref, 'refs/tags/v') }}
          tags: ghcr.io/${{ github.repository }}:pterodactyl
          load: true

      - name: Test Pterodactyl image boots
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: |
          docker run --rm -d --name steel-test -p 25565:25565 ghcr.io/${{ github.repository }}:pterodactyl || docker run --rm -d --name steel-test -p 25565:25565 steelmc:pterodactyl || true
          sleep 5
          docker logs steel-test 2>&1 | head -n 50 || true
          docker stop steel-test || true

      - name: Prepare release asset (rename with target)
        run: |
          cp target/${{ matrix.target }}/release/steel steel-${{ matrix.target }} || cp target/release/steel steel-${{ matrix.target }}
          ls -lh steel-${{ matrix.target }}
          sha256sum steel-${{ matrix.target }} | tee steel-${{ matrix.target }}.sha256

      - name: Upload release-ready artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-steel-${{ matrix.target }}
          path: |
            steel-${{ matrix.target }}
            steel-${{ matrix.target }}.sha256
          retention-days: 90

  release:
    name: Create GitHub Release (ядро)
    if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/arena/b3a39197-steelmc'
    needs: build-linux
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all steel binaries
        uses: actions/download-artifact@v4
        with:
          pattern: release-steel-*
          merge-multiple: true

      - name: List binaries + Pterodactyl egg
        run: |
          ls -lh steel-* || true
          cat steel-*.sha256 || true
          ls -lh pterodactyl-egg.json Dockerfile.pterodactyl PTERODACTYL.md || true

      - name: Create / Update Release (ядро + Pterodactyl)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('nightly-{0}', github.sha) }}
          name: SteelMC ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('nightly {0} (26.3)', github.sha) }}
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/v') }}
          generate_release_notes: true
          files: |
            steel-x86_64-unknown-linux-gnu
            steel-aarch64-unknown-linux-gnu
            steel-*.sha256
            pterodactyl-egg.json
            Dockerfile.pterodactyl
            PTERODACTYL.md
          body: |
            **SteelMC 26.3 — Rust сервер без todo/proxy, 60/60, MSPT/RAM имба**

            - Сборка: `cargo build --release --locked --features stand-alone` (nightly-2026-10-14)
            - Linux контейнер: `ghcr.io/${{ github.repository }}:nightly` (`Dockerfile` scratch) и `ghcr.io/${{ github.repository }}:pterodactyl` (`Dockerfile.pterodactyl` debian+tini+container)
            - Pterodactyl: импортируйте `pterodactyl-egg.json` (Egg v2, startup `./steel`, done `Done! For help`, stop `stop`), порт 25565
            - Проверка: `lint`/`fmt`/`test`/`vanilla parity 0 missing` — зелёные
            - Бинари: `steel-x86_64-unknown-linux-gnu` (x64), `steel-aarch64-unknown-linux-gnu` (ARM64), `.sha256`

            ```bash
            # Pterodactyl / Linux
            chmod +x steel-x86_64-unknown-linux-gnu
            ./steel-x86_64-unknown-linux-gnu
            # или Docker
            docker run -p 25565:25565 ghcr.io/${{ github.repository }}:pterodactyl
            ```

      - name: Push Pterodactyl Docker image to GHCR
        if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/arena/b3a39197-steelmc'
        run: |
          echo "Docker pterodactyl image already built as ghcr.io/${{ github.repository }}:pterodactyl (load:true). To push, rebuild with push:true in separate workflow (docker-build.yml handles nightly)."
